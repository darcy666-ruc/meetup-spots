<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>工作日程</title>
<style>
  :root{
    --red:#A6192E; --red-dark:#8C1526; --bg:#FAF7F5; --card:#FFFFFF;
    --ink:#2B2320; --muted:#8A7F78; --line:#EDE4DE;
    --blue:#1F4E79; --green:#2E7D32;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg); color:var(--ink); min-height:100vh;}
  button{font-family:inherit;}

  /* ---------- 密码门 ---------- */
  #gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-card{background:var(--card); border-radius:16px; padding:36px 28px; width:100%; max-width:380px;
             box-shadow:0 8px 30px rgba(60,20,25,.08); border-top:4px solid var(--red); text-align:center;}
  .gate-card .emblem{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:var(--red);
             color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;}
  .gate-card h1{font-size:19px;margin:0 0 6px;}
  .gate-card p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.6;white-space:pre-line;}
  .gate-card input{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);
             border-radius:10px;margin-bottom:12px;outline:none;text-align:center;letter-spacing:2px;}
  .gate-card input:focus{border-color:var(--red);}
  .gate-btn{width:100%;padding:13px;font-size:16px;font-weight:600;color:#fff;background:var(--red);
             border:none;border-radius:10px;cursor:pointer;}
  .gate-btn:active{background:var(--red-dark);}
  .gate-err{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 8px;}
  .remember{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:14px;}
  .remember input{width:auto;margin:0;}
  .gate-tip{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6;}
  #forgotLink{display:inline-block;margin-top:12px;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer;}

  /* ---------- 主界面 ---------- */
  #app{display:none; max-width:640px; margin:0 auto; padding:0 0 90px;}
  header{background:var(--red); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px;
         position:sticky; top:0; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,.12);}
  header .title{font-size:17px; font-weight:700; flex:1;}
  #syncDot{display:flex;align-items:center;gap:5px;font-size:12px;opacity:.95;}
  #syncDot .dot{width:8px;height:8px;border-radius:50%;background:#7CFC9A;}
  #syncDot.syncing .dot{background:#FFD54F;}
  #syncDot.error .dot{background:#FF8A80;}
  #menuBtn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:16px;padding:6px 11px;border-radius:8px;cursor:pointer;}
  #menu{position:fixed;top:56px;right:12px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);
        display:none;z-index:25;overflow:hidden;min-width:160px;}
  #menu button{display:block;width:100%;text-align:left;padding:13px 16px;font-size:14px;border:none;background:#fff;cursor:pointer;color:var(--ink);}
  #menu button:active{background:#F5EFEB;}
  #menu button+button{border-top:1px solid var(--line);}

  /* 月历 */
  #calCard{background:var(--card);margin:14px 14px 0;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(60,20,25,.05);}
  #calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  #calHead .ym{font-size:16px;font-weight:700;}
  #calHead button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:14px;color:var(--ink);cursor:pointer;}
  #weekRow,#calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  #weekRow div{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;}
  .day{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
       border-radius:10px;font-size:14px;cursor:pointer;position:relative;border:none;background:transparent;color:var(--ink);}
  .day.other{color:#C9BFB8;}
  .day.today{font-weight:700;color:var(--red);}
  .day.sel{background:var(--red);color:#fff;}
  .day.sel.today{color:#fff;}
  .dots{display:flex;gap:3px;margin-top:3px;height:5px;}
  .dots i{width:5px;height:5px;border-radius:50%;display:block;}

  /* 当日任务 */
  #daySec{margin:14px;}
  #dayTitle{font-size:15px;font-weight:700;margin:4px 2px 10px;display:flex;align-items:baseline;gap:8px;}
  #dayTitle .sub{font-size:12px;color:var(--muted);font-weight:400;}
  .task{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;
        box-shadow:0 2px 8px rgba(60,20,25,.05);border-left:4px solid var(--red);cursor:pointer;}
  .task[data-cat="work"]{border-left-color:var(--blue);}
  .task[data-cat="personal"]{border-left-color:var(--green);}
  .task .chk{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;flex-shrink:0;margin-top:2px;
        display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:#fff;}
  .task.done .chk{background:var(--green);border-color:var(--green);}
  .task.done .t-title{text-decoration:line-through;color:var(--muted);}
  .task .t-body{flex:1;min-width:0;}
  .t-top{display:flex;align-items:center;gap:8px;}
  .t-time{font-size:13px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;}
  .task[data-cat="work"] .t-time{color:var(--blue);}
  .task[data-cat="personal"] .t-time{color:var(--green);}
  .t-title{font-size:15px;font-weight:600;flex:1;word-break:break-all;}
  .t-cat{font-size:11px;padding:2px 8px;border-radius:20px;flex-shrink:0;}
  .t-cat.party{background:#FBE9EC;color:var(--red);}
  .t-cat.work{background:#E8F0F8;color:var(--blue);}
  .t-cat.personal{background:#E9F4EA;color:var(--green);}
  .t-note{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-all;}
  #emptyDay{text-align:center;color:var(--muted);font-size:13px;padding:26px 0;background:var(--card);border-radius:12px;
        border:1.5px dashed var(--line);}
  .dayfile{display:flex;align-items:center;gap:8px;background:#FDF9F4;border:1px solid #F0E6D2;border-radius:10px;
        padding:8px 12px;margin-bottom:8px;font-size:13px;cursor:pointer;}
  .dayfile .ic{flex-shrink:0;}
  .dayfile .nm{flex:1;word-break:break-all;color:var(--ink);}
  .dayfile .sz{color:var(--muted);flex-shrink:0;font-size:12px;}

  /* 近期提醒 */
  #upSec{margin:16px 14px 0;}
  #upSec h2, #libSec h2{font-size:14px;margin:0 2px 8px;color:var(--muted);font-weight:600;}
  .up-item{background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:7px;font-size:13px;
        display:flex;gap:8px;align-items:center;box-shadow:0 1px 6px rgba(60,20,25,.04);cursor:pointer;}
  .up-date{font-weight:700;color:var(--red);flex-shrink:0;font-variant-numeric:tabular-nums;}

  /* 文件库 */
  #libSec{margin:18px 14px 0;}
  #libSearch{width:100%;padding:10px 12px;font-size:14px;border:1.5px solid var(--line);border-radius:10px;
        outline:none;margin-bottom:10px;background:#fff;}
  #libSearch:focus{border-color:var(--red);}
  .lib-date{font-size:12px;color:var(--red);font-weight:700;margin:10px 2px 6px;}
  .lib-item{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:14px;
        display:flex;gap:10px;align-items:center;box-shadow:0 1px 6px rgba(60,20,25,.04);cursor:pointer;}
  .lib-item .ic{font-size:18px;flex-shrink:0;}
  .lib-item .nm{flex:1;word-break:break-all;font-weight:600;}
  .lib-item .mt{font-size:11px;color:var(--muted);flex-shrink:0;text-align:right;line-height:1.4;}
  .lib-empty{font-size:13px;color:var(--muted);padding:8px 2px;}

  /* 添加按钮 */
  #addBtn{position:fixed;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
        background:var(--red);color:#fff;font-size:30px;border:none;box-shadow:0 6px 16px rgba(166,25,46,.35);
        cursor:pointer;line-height:1;z-index:20;display:none;}
  #addBtn:active{background:var(--red-dark);}

  /* 弹层通用 */
  .mask{position:fixed;inset:0;background:rgba(30,15,18,.45);display:none;z-index:30;
        align-items:flex-end;justify-content:center;}
  .sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
        max-height:88vh;overflow-y:auto;}
  .sheet h3{margin:0 0 16px;font-size:17px;}
  .f-row{margin-bottom:14px;}
  .f-row label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .f-row input,.f-row textarea{width:100%;padding:11px 12px;font-size:15px;border:1.5px solid var(--line);
        border-radius:10px;outline:none;font-family:inherit;}
  .f-row input:focus,.f-row textarea:focus{border-color:var(--red);}
  .f-row textarea{resize:vertical;min-height:64px;}
  .cat-row{display:flex;gap:8px;}
  .cat-opt{flex:1;padding:10px 0;text-align:center;border:1.5px solid var(--line);border-radius:10px;
        font-size:14px;cursor:pointer;background:#fff;}
  .cat-opt.on[data-v="party"]{border-color:var(--red);background:#FBE9EC;color:var(--red);font-weight:600;}
  .cat-opt.on[data-v="work"]{border-color:var(--blue);background:#E8F0F8;color:var(--blue);font-weight:600;}
  .cat-opt.on[data-v="personal"]{border-color:var(--green);background:#E9F4EA;color:var(--green);font-weight:600;}
  .m-btns{display:flex;gap:10px;margin-top:6px;}
  .m-btns button{flex:1;padding:13px;font-size:15px;border-radius:10px;border:none;cursor:pointer;font-weight:600;}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-plain{background:#F3EDEA;color:var(--ink);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid var(--red)!important;flex:0 0 84px;}
  #delBtn{display:none;}

  /* 导入 */
  #impMask .sheet, #impMask input, #impMask textarea, #impList, #impSaved, #impMask .imp-hint{
        font-family:"Times New Roman","Kaiti SC","KaiTi","STKaiti","SimSun",serif;}
  #impText{min-height:120px;}
  .imp-file{display:block;width:100%;padding:12px;border:1.5px dashed var(--line);border-radius:10px;
        text-align:center;font-size:14px;color:var(--muted);cursor:pointer;margin-bottom:12px;}
  .imp-item{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px;}
  .imp-item .d{color:var(--red);font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .imp-item .tm{color:var(--muted);flex-shrink:0;}
  .imp-item .ti{flex:1;word-break:break-all;}
  .imp-hint{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:10px;}
  #impSaved{font-size:13px;color:var(--green);margin-bottom:10px;display:none;}

  /* 文件查看器 */
  #viewMask .sheet{max-height:92vh;}
  #viewMeta{font-size:12px;color:var(--muted);margin:-8px 0 12px;}
  #viewText{background:#FAF7F5;border-radius:10px;padding:14px;font-size:13px;line-height:1.8;
        white-space:pre-wrap;word-break:break-all;max-height:46vh;overflow-y:auto;border:1px solid var(--line);}

  #rcBig{font-size:26px;font-weight:700;letter-spacing:2px;color:var(--red);text-align:center;
        font-variant-numeric:tabular-nums;padding:18px 0 6px;}
  #rcTip{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;padding-bottom:10px;}

  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(30,20,22,.88);color:#fff;
        padding:9px 18px;border-radius:20px;font-size:13px;display:none;z-index:40;max-width:80%;text-align:center;}
  footer{text-align:center;font-size:11px;color:var(--muted);margin-top:24px;line-height:1.7;}
</style>
</head>
<body>

<!-- 密码门 -->
<div id="gate">
  <div class="gate-card">
    <div class="emblem">日</div>
    <h1 id="gateTitle">工作日程</h1>
    <p id="gateDesc">输入你的昵称和密码进入</p>
    <div class="gate-err" id="gateErr"></div>
    <input type="text" id="nickInput" placeholder="你的昵称" autocomplete="off" style="letter-spacing:0">
    <input type="password" id="pw1" placeholder="密码" autocomplete="current-password">
    <input type="password" id="pw2" placeholder="再输一次确认" style="display:none" autocomplete="new-password">
    <label class="remember" id="rememberRow"><input type="checkbox" id="rememberChk" checked>在这台设备上记住登录</label>
    <button class="gate-btn" id="gateBtn">进 入</button>
    <span id="forgotLink">忘记密码？直接重设</span>
    <div class="gate-tip">🔒 凭昵称和密码进入自己的空间<br>数据加密存储，互相不可见</div>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header>
    <div class="title">工作日程</div>
    <div id="syncDot"><span class="dot"></span><span id="syncTxt">已同步</span></div>
    <button id="menuBtn">⋯</button>
  </header>
  <div id="menu">
    <button id="mImport">📥 导入日程/文件</button>
    <button id="mPwd">🔑 修改密码</button>
    <button id="mLock">🔒 退出登录</button>
  </div>

  <div id="calCard">
    <div id="calHead">
      <button id="prevM">‹ 上月</button>
      <div class="ym" id="ymLabel"></div>
      <button id="nextM">下月 ›</button>
    </div>
    <div id="weekRow"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div id="calGrid"></div>
  </div>

  <div id="daySec">
    <div id="dayTitle"></div>
    <div id="dayList"></div>
    <div id="dayFiles"></div>
  </div>

  <div id="upSec"><h2>📌 即将到来</h2><div id="upList"></div></div>

  <div id="libSec">
    <h2>📁 文件库</h2>
    <input id="libSearch" placeholder="🔍 搜索文件名或内容…">
    <div id="libList"></div>
  </div>

  <footer>中国人民大学历史学院 · 个人工作日程</footer>
</div>

<button id="addBtn">＋</button>

<!-- 任务编辑弹层 -->
<div class="mask" id="modalMask">
  <div class="sheet">
    <h3 id="modalTitle">添加任务</h3>
    <div class="f-row"><label>日期</label><input type="date" id="fDate"></div>
    <div class="f-row"><label>时间（可不填）</label><input type="time" id="fTime"></div>
    <div class="f-row"><label>事项</label><input type="text" id="fTitle" placeholder="如：支部党员大会"></div>
    <div class="f-row"><label>分类</label>
      <div class="cat-row">
        <div class="cat-opt on" data-v="party">党团</div>
        <div class="cat-opt" data-v="work">工作</div>
        <div class="cat-opt" data-v="personal">个人</div>
      </div>
    </div>
    <div class="f-row"><label>备注（地点、注意事项等，可不填）</label><textarea id="fNote" placeholder="如：教三 3205，带笔记本"></textarea></div>
    <div class="m-btns">
      <button class="btn-danger" id="delBtn">删除</button>
      <button class="btn-plain" id="cancelBtn">取消</button>
      <button class="btn-primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 导入弹层 -->
<div class="mask" id="impMask">
  <div class="sheet">
    <h3>导入日程 / 文件</h3>
    <div class="f-row" style="margin-bottom:10px">
      <label>归入日期（文件会保存到这一天的日程下）</label>
      <input type="date" id="impDate">
    </div>
    <label class="imp-file">📄 选择文件（Word / Excel / PPT / txt，可多选）<input type="file" id="impFile" multiple
      accept=".txt,.md,.csv,.docx,.pptx,.xlsx,text/plain" style="display:none"></label>
    <div id="impSaved"></div>
    <div class="imp-hint">文件原件会存入下方「文件库」，同时自动把文字内容提取到下面，<br>点「解析成日程」可把每行带日期的内容转成日程（如「9月20日 14:00 党员大会 教三3205」）。</div>
    <textarea id="impText" placeholder="9月20日 14:00 支部党员大会 教三3205&#10;9月25日 主题团日活动&#10;2026-10-09 09:00 党委会"></textarea>
    <div class="m-btns">
      <button class="btn-plain" id="impCancel">关闭</button>
      <button class="btn-primary" id="impParse">解析成日程</button>
    </div>
    <div id="impPreview" style="display:none">
      <div class="imp-hint" style="margin-top:14px">识别结果（点条目可去掉不导入的）：</div>
      <div id="impList"></div>
      <div class="m-btns">
        <button class="btn-plain" id="impBack">返回</button>
        <button class="btn-primary" id="impConfirm">确认导入</button>
      </div>
    </div>
  </div>
</div>

<!-- 修改密码弹层 -->
<div class="mask" id="pwdMask">
  <div class="sheet">
    <h3>修改密码</h3>
    <div class="f-row"><label>新密码（至少4位）</label><input type="password" id="npw1" autocomplete="new-password"></div>
    <div class="f-row"><label>再输一次</label><input type="password" id="npw2" autocomplete="new-password"></div>
    <div class="imp-hint">修改密码后日程和文件全部保留。</div>
    <div class="gate-err" id="pwdErr"></div>
    <div class="m-btns">
      <button class="btn-plain" id="pwdCancel">取消</button>
      <button class="btn-primary" id="pwdSave">确认修改</button>
    </div>
  </div>
</div>

<!-- 文件查看器 -->
<div class="mask" id="viewMask">
  <div class="sheet">
    <h3 id="viewName">文件</h3>
    <div id="viewMeta"></div>
    <div id="viewText"></div>
    <div class="m-btns" style="margin-top:14px">
      <button class="btn-danger" id="viewDel">删除</button>
      <button class="btn-plain" id="viewClose">关闭</button>
      <button class="btn-primary" id="viewDl">下载原件</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= 配置（部署时注入） ================= */
const GIST_ID   = "0f8a99122a531fae448c779ad444c591";
const GIST_FILE = "store.json";
// token 分段 base64 存放（仅 gist 权限；数据已加密，拿到 token 也读不到内容）
const GH_TOKEN  = (()=>{ const a="Z2hvX2NRY1AxTWtia0cwQkpJTDRC", b="eHdyUDBERUk4azlSUzFtUEdSTg=="; return atob(a+b); })();
const LS_KEY    = "pd_schedule_key_v4";

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const pad2 = n => String(n).padStart(2,"0");
const todayStr = () => fmtDate(new Date());
function fmtDate(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display="none",2200); }
function fmtSize(n){ return n<1024? n+"B" : n<1048576? (n/1024).toFixed(0)+"KB" : (n/1048576).toFixed(1)+"MB"; }
function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
const FILE_ICON = {docx:"📝", pptx:"📊", xlsx:"📈", txt:"📄", md:"📄", csv:"📈"};

/* ================= 加密 =================
   数据密钥内嵌于页面（分段混淆存放）；密码是进入各自空间的门闩。
   忘记密码可直接重设，日程文件全部保留。*/
const DEK_B64 = (()=>{ const a="5vTNHWrHyIrqoMB0DUgeC+", b="WqaA+k34a6J14XHd0Ydno="; return a+b; })();
let DEK = null;
const dekReady = (async ()=>{
  DEK = await crypto.subtle.importKey("raw", b64d(DEK_B64), {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
})();
async function deriveKek(pw, salt){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encObj(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {iv:b64e(iv), c:b64e(ct)};
}
async function decObj(key, pack){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(pack.iv)}, key, b64d(pack.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ================= 云端存储（GitHub Gist · 每人一个独立槽位文件） ================= */
const gistApi = "https://api.github.com/gists/"+GIST_ID;
async function slotOf(nick){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("dag:"+nick.trim()));
  return "u_" + [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,24) + ".json";
}
async function cloudLoad(slot){
  const r = await fetch(gistApi, {headers:{"Accept":"application/vnd.github+json","Authorization":"token "+GH_TOKEN}});
  if(!r.ok) throw new Error("load "+r.status);
  const g = await r.json();
  const f = g.files && g.files[slot];
  if(!f) return null;
  return JSON.parse(f.content);
}
async function cloudSave(slot, store){
  const r = await fetch(gistApi, {method:"PATCH",
    headers:{"Authorization":"token "+GH_TOKEN,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
    body: JSON.stringify({files:{[slot]:{content:JSON.stringify(store)}}})});
  if(!r.ok) throw new Error("save "+r.status);
}

/* ================= 状态 ================= */
let tasks = [];
let files = [];
let curMonth = new Date(); curMonth.setDate(1);
let selDate = todayStr();
let editId = null, fCat = "party";
let saveTimer = null, dirty = false;
let storeMeta = null;      // {salt}
let nick = null, slotFile = null, curPw = null;
const ck = ()=>LS_KEY+"_"+slotFile;

function packData(){ return {tasks, files}; }
function unpackData(d){
  if(Array.isArray(d)){ tasks = d; files = []; }
  else { tasks = d.tasks || []; files = d.files || []; }
}

function setSync(state, txt){
  const d=$("syncDot"); d.className = state==="ok"?"":state;
  $("syncTxt").textContent = txt;
}
function scheduleSave(){
  dirty = true;
  setSync("syncing","同步中…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushAll, 700);
}
async function pushAll(){
  await dekReady;
  if(!storeMeta || !slotFile) return;
  try{
    const kekPw = await deriveKek(curPw, b64d(storeMeta.salt));
    const store = {v:5, salt:storeMeta.salt,
      wrapPw: await encObj(kekPw, "LOCK-OK"),
      data: await encObj(DEK, packData())};
    await cloudSave(slotFile, store);
    localStorage.setItem(ck(), JSON.stringify(store));
    dirty = false;
    setSync("ok","已同步");
  }catch(e){
    setSync("error","未同步(网络)");
  }
}
function rememberKey(){
  if(!$("rememberChk").checked){
    localStorage.removeItem(LS_KEY+"_jwk"); localStorage.removeItem(LS_KEY+"_lastnick"); return;
  }
  localStorage.setItem(LS_KEY+"_jwk", "1");
  localStorage.setItem(LS_KEY+"_lastnick", nick);
}

/* 读入一个槽位数据（兼容旧版 v4：用旧包裹密钥迁移到内置密钥） */
async function loadSlotData(store){
  await dekReady;
  if(store.v >= 5 || !store.wrapRc){
    unpackData(await decObj(DEK, store.data));
  }else{
    // 旧版：wrapPw 里是独立数据密钥
    const kek = await deriveKek(curPw, b64d(store.salt));
    const wrap = await decObj(kek, store.wrapPw);
    const oldDek = await crypto.subtle.importKey("raw", b64d(wrap.k), {name:"AES-GCM"}, false, ["decrypt"]);
    const d = await decObj(oldDek, store.data);
    delete d.rc;
    unpackData(d);
    scheduleSave(); // 迁移为新格式
  }
}

/* ================= 密码门 ================= */
let gateMode = "pw";  // pw | setup | reset

async function initGate(){
  await dekReady;
  $("app").style.display="none"; $("addBtn").style.display="none"; $("menu").style.display="none";
  $("gate").style.display="flex";
  // 记住登录
  const saved = localStorage.getItem(LS_KEY+"_jwk");
  const lastNick = localStorage.getItem(LS_KEY+"_lastnick");
  if(saved && lastNick){
    try{
      nick = lastNick;
      slotFile = await slotOf(nick);
      const cached = localStorage.getItem(ck());
      if(!cached) throw 0;
      const store = JSON.parse(cached);
      storeMeta = {salt: store.salt};
      await loadSlotData(store);
      enterApp(); backgroundPull(); return;
    }catch(e){ localStorage.removeItem(LS_KEY+"_jwk"); }
  }
  pwMode("输入你的昵称和密码");
  $("gateBtn").onclick = onGateSubmit;
  $("pw1").onkeydown = e=>{ if(e.key==="Enter") onGateSubmit(); };
  $("pw2").onkeydown = e=>{ if(e.key==="Enter") onGateSubmit(); };
  $("nickInput").onkeydown = e=>{ if(e.key==="Enter") onGateSubmit(); };
}
function gateBase(){
  $("nickInput").style.display="none";
  $("gateErr").textContent = "";
  $("forgotLink").style.display = "inline-block";
  $("rememberRow").style.display = "flex";
  $("pw1").style.display="none"; $("pw2").style.display="none"; $("pw1").value=""; $("pw2").value="";
}
function pwMode(desc){
  gateMode = "pw"; gateBase();
  $("gateTitle").textContent = "工作日程";
  $("gateDesc").textContent = desc;
  $("nickInput").style.display="block";
  $("pw1").placeholder = "密码"; $("pw1").style.display="block";
  $("gateBtn").textContent = "进 入";
}
function setupMode(){
  gateMode = "setup"; gateBase();
  $("gateTitle").textContent = "欢迎，"+nick;
  $("gateDesc").textContent = "第一次使用，设一个你的专属密码";
  $("pw1").placeholder = "设置一个密码"; $("pw1").style.display="block";
  $("pw2").style.display="block";
  $("gateBtn").textContent = "设置并进入";
  $("forgotLink").style.display = "none";
  $("gateBtn").onclick = onGateSubmit;
}
function resetMode(){
  gateMode = "reset"; gateBase();
  $("gateTitle").textContent = "重设密码";
  $("gateDesc").textContent = "输入你的昵称，直接设置新密码\n（日程和文件全部保留，不受影响）";
  $("nickInput").style.display="block";
  $("pw1").placeholder = "新密码"; $("pw1").style.display="block";
  $("pw2").style.display="block";
  $("rememberRow").style.display = "none";
  $("gateBtn").textContent = "重设并进入";
  $("gateBtn").onclick = onGateSubmit;
}
$("forgotLink").onclick = ()=> resetMode();

async function onGateSubmit(){
  $("gateErr").textContent = "";
  const nk = $("nickInput").value.trim();
  const pw = $("pw1").value;

  if(gateMode === "pw"){
    if(!nk){ $("gateErr").textContent="请填写你的昵称"; return; }
    if(pw.length < 4){ $("gateErr").textContent="密码至少 4 位"; return; }
    nick = nk;
    slotFile = await slotOf(nick);
    let store = null;
    try{ store = await cloudLoad(slotFile); }
    catch(e){
      const c = localStorage.getItem(ck());
      if(c) store = JSON.parse(c);
      else { $("gateErr").textContent="网络异常，请检查网络后重试"; return; }
    }
    if(store && store.wrapPw){
      storeMeta = {salt: store.salt};
      localStorage.setItem(ck(), JSON.stringify(store));
      try{
        const kek = await deriveKek(pw, b64d(store.salt));
        const proof = await decObj(kek, store.wrapPw);
        if(proof !== "LOCK-OK"){
          if(!(proof && proof.k)) throw 0;   // 旧版格式也放行，走迁移
        }
        curPw = pw;
        await loadSlotData(store);
        enterApp(); rememberKey(); backgroundPull();
      }catch(e){
        $("gateErr").textContent = "密码不正确（若你是第一次用，说明这个昵称已被别人用了，请写全一点，如「王芳老师」）";
      }
    }else{
      setupMode();
    }
  }
  else if(gateMode === "reset"){
    if(!nk){ $("gateErr").textContent="请填写你的昵称"; return; }
    if(pw.length < 4){ $("gateErr").textContent="新密码至少 4 位"; return; }
    if(pw !== $("pw2").value){ $("gateErr").textContent="两次输入不一致"; return; }
    nick = nk;
    slotFile = await slotOf(nick);
    let store = null;
    try{ store = await cloudLoad(slotFile); }catch(e){
      const c = localStorage.getItem(ck());
      if(c) store = JSON.parse(c);
    }
    if(!store){ $("gateErr").textContent="没有找到这个昵称的空间，请核对昵称"; return; }
    try{
      storeMeta = {salt: store.salt};
      await loadSlotData(store);   // 数据用内置密钥解开，原样保留
    }catch(e){
      $("gateErr").textContent="数据读取失败，请重试"; return;
    }
    curPw = pw;
    storeMeta.salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
    enterApp(); rememberKey(); await pushAll();
    toast("密码已重设，所有内容都在");
  }
  else{ // setup
    if(pw.length < 4){ $("gateErr").textContent="密码至少 4 位"; return; }
    if(pw !== $("pw2").value){ $("gateErr").textContent="两次输入不一致"; return; }
    curPw = pw;
    tasks = []; files = [];
    storeMeta = {salt: b64e(crypto.getRandomValues(new Uint8Array(16)))};
    enterApp(); rememberKey(); await pushAll();
    toast("空间已开通");
  }
}

/* ================= 主界面渲染 ================= */
const CAT_NAME = {party:"党团", work:"工作", personal:"个人"};
const CAT_COLOR = {party:"#A6192E", work:"#1F4E79", personal:"#2E7D32"};

function enterApp(){
  $("gate").style.display="none";
  $("app").style.display="block";
  $("addBtn").style.display="block";
  setSync(dirty?"syncing":"ok", dirty?"同步中…":"已同步");
  renderAll();
}
async function backgroundPull(){
  if(dirty) return;
  try{
    const store = await cloudLoad(slotFile);
    if(!store || !store.wrapPw || dirty) return;
    unpackData(await decObj(DEK, store.data));
    localStorage.setItem(LS_KEY+"_cache", JSON.stringify(store));
    storeMeta = {salt: store.salt};
    renderAll(); setSync("ok","已同步");
  }catch(e){ /* 保持本地 */ }
}
function renderAll(){ renderCal(); renderDay(); renderUpcoming(); renderLib(); }

function renderCal(){
  const y = curMonth.getFullYear(), m = curMonth.getMonth();
  $("ymLabel").textContent = y+" 年 "+(m+1)+" 月";
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysIn = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const grid = $("calGrid"); grid.innerHTML = "";
  const total = Math.ceil((startOffset+daysIn)/7)*7;
  for(let i=0;i<total;i++){
    const btn = document.createElement("button"); btn.className="day";
    let dObj, other=false;
    if(i < startOffset){ dObj = new Date(y, m-1, prevDays-(startOffset-1-i)); other=true; }
    else if(i >= startOffset+daysIn){ dObj = new Date(y, m+1, i-startOffset-daysIn+1); other=true; }
    else{ dObj = new Date(y, m, i-startOffset+1); }
    const ds = fmtDate(dObj);
    btn.textContent = dObj.getDate();
    if(other) btn.classList.add("other");
    if(ds === todayStr()) btn.classList.add("today");
    if(ds === selDate) btn.classList.add("sel");
    const dayTasks = tasks.filter(t=>t.date===ds);
    const hasFile = files.some(f=>f.date===ds);
    if(dayTasks.length || hasFile){
      const dots = document.createElement("span"); dots.className="dots";
      [...new Set(dayTasks.map(t=>t.cat))].slice(0,3).forEach(c=>{
        const dot=document.createElement("i"); dot.style.background=CAT_COLOR[c]; dots.appendChild(dot);
      });
      if(hasFile){ const dot=document.createElement("i"); dot.style.background="#B8860B"; dots.appendChild(dot); }
      btn.appendChild(dots);
    }
    btn.onclick = ()=>{
      selDate = ds;
      if(other){ curMonth = new Date(dObj.getFullYear(), dObj.getMonth(), 1); }
      renderAll();
    };
    grid.appendChild(btn);
  }
}
function renderDay(){
  const d = new Date(selDate+"T00:00:00");
  const wk = ["日","一","二","三","四","五","六"][d.getDay()];
  $("dayTitle").innerHTML = (d.getMonth()+1)+"月"+d.getDate()+"日 周"+wk +
    (selDate===todayStr()?'<span class="sub">今天</span>':"");
  const list = tasks.filter(t=>t.date===selDate).sort((a,b)=>(a.time||"99")<(b.time||"99")?-1:1);
  const box = $("dayList"); box.innerHTML="";
  if(!list.length){
    box.innerHTML = '<div id="emptyDay">这一天还没有安排<br>点右下角 ＋ 添加，或点右上角 ⋯ 导入</div>';
  }else{
    list.forEach(t=> box.appendChild(taskEl(t)));
  }
  const df = $("dayFiles"); df.innerHTML = "";
  files.filter(f=>f.date===selDate).forEach(f=>{
    const el = document.createElement("div"); el.className="dayfile";
    el.innerHTML = '<span class="ic">'+(FILE_ICON[f.ext]||"📎")+'</span><span class="nm"></span><span class="sz">'+fmtSize(f.size)+'</span>';
    el.querySelector(".nm").textContent = f.name;
    el.onclick = ()=> openViewer(f.id);
    df.appendChild(el);
  });
}
function taskEl(t){
  const el = document.createElement("div");
  el.className = "task"+(t.done?" done":""); el.dataset.cat = t.cat;
  el.innerHTML =
    '<div class="chk">'+(t.done?"✓":"")+'</div>'+
    '<div class="t-body"><div class="t-top">'+
    (t.time?'<span class="t-time">'+t.time+'</span>':"")+
    '<span class="t-title"></span>'+
    '<span class="t-cat '+t.cat+'">'+CAT_NAME[t.cat]+'</span></div>'+
    (t.note?'<div class="t-note"></div>':"")+'</div>';
  el.querySelector(".t-title").textContent = t.title;
  if(t.note) el.querySelector(".t-note").textContent = t.note;
  el.querySelector(".chk").onclick = e=>{
    e.stopPropagation(); t.done=!t.done; renderAll(); scheduleSave();
  };
  el.onclick = ()=> openModal(t);
  return el;
}
function renderUpcoming(){
  const box = $("upList"); box.innerHTML="";
  const now = todayStr();
  const up = tasks.filter(t=>t.date>=now && !t.done)
      .sort((a,b)=> a.date===b.date ? (a.time||"99")<(b.time||"99")?-1:1 : a.date<b.date?-1:1)
      .slice(0,5);
  if(!up.length){ box.innerHTML='<div style="font-size:13px;color:var(--muted);padding:4px 2px;">暂无待办安排</div>'; return; }
  up.forEach(t=>{
    const el = document.createElement("div"); el.className="up-item";
    const d = t.date.slice(5).replace("-","月")+"日";
    el.innerHTML = '<span class="up-date">'+d+'</span>'+
      (t.time?'<span style="color:var(--muted)">'+t.time+'</span>':"")+
      '<span style="flex:1" class="up-t"></span>'+
      '<span class="t-cat '+t.cat+'">'+CAT_NAME[t.cat]+'</span>';
    el.querySelector(".up-t").textContent = t.title;
    el.onclick = ()=>{ selDate=t.date; curMonth=new Date(+t.date.slice(0,4), +t.date.slice(5,7)-1, 1); renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    box.appendChild(el);
  });
}

/* ================= 文件库 ================= */
$("libSearch").oninput = ()=> renderLib();
function renderLib(){
  const q = $("libSearch").value.trim();
  const box = $("libList"); box.innerHTML="";
  if(!files.length){
    box.innerHTML = '<div class="lib-empty">还没有文件。点右上角 ⋯ → 导入日程/文件，Word、Excel、PPT 原件会保存在这里，随时查找。</div>';
    return;
  }
  const sorted = [...files].sort((a,b)=> b.date<a.date?-1:1);
  const filtered = q ? sorted.filter(f=> f.name.includes(q) || (f.text||"").includes(q)) : sorted;
  if(!filtered.length){
    box.innerHTML = '<div class="lib-empty">没有找到含「'+escHtml(q)+'」的文件</div>';
    return;
  }
  let lastD = null;
  filtered.forEach(f=>{
    if(f.date !== lastD){
      lastD = f.date;
      const hd = document.createElement("div"); hd.className="lib-date";
      hd.textContent = f.date.replace(/-/g,"/");
      box.appendChild(hd);
    }
    const el = document.createElement("div"); el.className="lib-item";
    el.innerHTML = '<span class="ic">'+(FILE_ICON[f.ext]||"📎")+'</span><span class="nm"></span>'+
      '<span class="mt">'+fmtSize(f.size)+'</span>';
    el.querySelector(".nm").textContent = f.name;
    el.onclick = ()=> openViewer(f.id);
    box.appendChild(el);
  });
}

/* 文件查看器 */
let viewId = null;
function openViewer(id){
  const f = files.find(x=>x.id===id); if(!f) return;
  viewId = id;
  $("viewName").textContent = f.name;
  $("viewMeta").textContent = "归入日期 "+f.date.replace(/-/g,"/")+" · "+fmtSize(f.size);
  $("viewText").textContent = f.text || "（无文字内容可预览）";
  $("viewMask").style.display="flex";
}
$("viewClose").onclick = ()=> $("viewMask").style.display="none";
$("viewMask").onclick = e=>{ if(e.target===$("viewMask")) $("viewMask").style.display="none"; };
$("viewDl").onclick = ()=>{
  const f = files.find(x=>x.id===viewId); if(!f || !f.dataB64){ toast("原件不可用"); return; }
  const bin = atob(f.dataB64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const blob = new Blob([arr], {type:"application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = f.name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
};
$("viewDel").onclick = ()=>{
  const f = files.find(x=>x.id===viewId); if(!f) return;
  if(!confirm("删除文件「"+f.name+"」？日程不受影响。")) return;
  files = files.filter(x=>x.id!==viewId);
  $("viewMask").style.display="none";
  renderAll(); scheduleSave();
  toast("已删除");
};

function openModal(task){
  editId = task ? task.id : null;
  $("modalTitle").textContent = task ? "编辑任务" : "添加任务";
  $("fDate").value = task ? task.date : selDate;
  $("fTime").value = task ? (task.time||"") : "";
  $("fTitle").value = task ? task.title : "";
  $("fNote").value  = task ? (task.note||"") : "";
  fCat = task ? task.cat : "party";
  document.querySelectorAll(".cat-opt").forEach(o=>o.classList.toggle("on", o.dataset.v===fCat));
  $("delBtn").style.display = task ? "block" : "none";
  $("modalMask").style.display = "flex";
}
document.querySelectorAll(".cat-opt").forEach(o=> o.onclick = ()=>{
  fCat = o.dataset.v;
  document.querySelectorAll(".cat-opt").forEach(x=>x.classList.toggle("on", x===o));
});
$("addBtn").onclick = ()=>openModal(null);
$("cancelBtn").onclick = ()=> $("modalMask").style.display="none";
$("modalMask").onclick = e=>{ if(e.target===$("modalMask")) $("modalMask").style.display="none"; };
$("saveBtn").onclick = ()=>{
  const title = $("fTitle").value.trim();
  if(!title){ toast("请填写事项内容"); return; }
  const data = {date:$("fDate").value||selDate, time:$("fTime").value, title,
                cat:fCat, note:$("fNote").value.trim()};
  if(editId){
    const t = tasks.find(x=>x.id===editId);
    if(t) Object.assign(t, data);
  }else{
    tasks.push(Object.assign({id:Date.now()+"-"+Math.random().toString(36).slice(2,7), done:false}, data));
  }
  selDate = data.date;
  curMonth = new Date(+data.date.slice(0,4), +data.date.slice(5,7)-1, 1);
  $("modalMask").style.display="none";
  renderAll(); scheduleSave();
  toast("已保存");
};
$("delBtn").onclick = ()=>{
  if(!editId) return;
  if(!confirm("确定删除这条任务吗？")) return;
  tasks = tasks.filter(x=>x.id!==editId);
  $("modalMask").style.display="none";
  renderAll(); scheduleSave();
  toast("已删除");
};

/* ================= Office 文件文字提取 ================= */
function xmlUnescape(s){
  return s.replace(/&#x([0-9a-fA-F]+);/g,(m,n)=>String.fromCodePoint(parseInt(n,16)))
          .replace(/&#(\d+);/g,(m,n)=>String.fromCodePoint(+n))
          .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
          .replace(/&apos;/g,"'").replace(/&amp;/g,'&');
}
function stripXml(xml){
  return xmlUnescape(xml.replace(/<[^>]+>/g,'').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n'));
}
async function extractDocx(buf){
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('word/document.xml');
  if(!f) throw new Error('bad docx');
  const xml = await f.async('string');
  return stripXml(xml.replace(/<\/w:p>/g,'\n').replace(/<w:tab[^>]*\/>/g,' ').replace(/<w:br[^>]*\/>/g,'\n')).trim();
}
async function extractPptx(buf){
  const zip = await JSZip.loadAsync(buf);
  const slides = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b)=> (+a.match(/\d+/)[0]) - (+b.match(/\d+/)[0]));
  const parts = [];
  for(const n of slides){
    const xml = await zip.file(n).async('string');
    const txt = stripXml(xml.replace(/<\/a:p>/g,'\n')).trim();
    if(txt) parts.push(txt);
  }
  return parts.join('\n');
}
async function extractXlsx(buf){
  const zip = await JSZip.loadAsync(buf);
  let shared = [];
  const ss = zip.file('xl/sharedStrings.xml');
  if(ss){
    const xml = await ss.async('string');
    const siList = xml.match(/<si[\s\S]*?<\/si>/g) || [];
    shared = siList.map(si=>{
      const ts = si.match(/<t[^>]*>[\s\S]*?<\/t>/g) || [];
      return xmlUnescape(ts.map(t=>t.replace(/<[^>]+>/g,'')).join(''));
    });
  }
  const sheets = Object.keys(zip.files)
    .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a,b)=> (+a.match(/\d+/)[0]) - (+b.match(/\d+/)[0]));
  const out = [];
  for(const n of sheets){
    const xml = await zip.file(n).async('string');
    const rows = xml.match(/<row[\s\S]*?<\/row>/g) || [];
    for(const row of rows){
      const cells = row.match(/<c[\s\S]*?(<\/c>|\/>)/g) || [];
      const vals = cells.map(c=>{
        const t = (c.match(/\bt="(\w+)"/)||[])[1];
        const v = (c.match(/<v>[\s\S]*?<\/v>/)||[null])[0];
        const vv = v ? v.replace(/<\/?v>/g,'') : null;
        if(t==='s' && vv!=null) return shared[+vv] || '';
        if(t==='inlineStr'){
          const it = (c.match(/<t[^>]*>([\s\S]*?)<\/t>/)||[])[1];
          return xmlUnescape(it||'');
        }
        return vv!=null ? xmlUnescape(vv) : '';
      }).filter(s=>s!=='');
      if(vals.length) out.push(vals.join(' '));
    }
  }
  return out.join('\n');
}
async function extractOffice(name, buf){
  const ext = name.split('.').pop().toLowerCase();
  if(ext==='docx') return extractDocx(buf);
  if(ext==='pptx') return extractPptx(buf);
  if(ext==='xlsx') return extractXlsx(buf);
  return new TextDecoder('utf-8').decode(buf);
}

/* ================= 导入 ================= */
let impParsed = [];
$("mImport").onclick = ()=>{
  $("impText").value=""; $("impPreview").style.display="none"; $("impList").innerHTML="";
  $("impSaved").style.display="none";
  $("impDate").value = selDate;
  $("impMask").style.display="flex";
};
$("impCancel").onclick = ()=> $("impMask").style.display="none";
$("impMask").onclick = e=>{ if(e.target===$("impMask")) $("impMask").style.display="none"; };
$("impFile").onchange = async e=>{
  const list = [...e.target.files]; if(!list.length) return;
  e.target.value = "";
  const date = $("impDate").value || selDate;
  let savedN = 0, extracted = [];
  for(const f of list){
    const ext = f.name.split('.').pop().toLowerCase();
    if(['doc','ppt','xls'].includes(ext)){
      toast("「"+f.name+"」是老版格式，请先另存为 ."+ext+"x 再导入"); continue;
    }
    if(f.size > 8*1024*1024){ toast("「"+f.name+"」超过 8MB，太大存不下"); continue; }
    try{
      const buf = await f.arrayBuffer();
      let text = "";
      try{ text = await extractOffice(f.name, buf); }catch(err){ text = ""; }
      const bin = new Uint8Array(buf);
      let b64 = "";
      for(let i=0;i<bin.length;i+=8192) b64 += String.fromCharCode(...bin.subarray(i,i+8192));
      files.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,7),
        name:f.name, ext, size:f.size, date, text, dataB64:btoa(b64)});
      savedN++;
      if(text) extracted.push("【"+f.name+"】\n"+text);
    }catch(err){ toast("「"+f.name+"」读取失败"); }
  }
  if(savedN){
    $("impSaved").style.display="block";
    $("impSaved").textContent = "✅ 已把 "+savedN+" 个文件存入文件库（"+date.replace(/-/g,"/")+"）";
    if(extracted.length) $("impText").value = extracted.join("\n");
    renderAll(); scheduleSave();
  }
};
function parseImport(text){
  const curYear = new Date().getFullYear();
  const out = []; let lastDate = null;
  for(const raw of text.split(/\r?\n/)){
    let ln = raw.trim();
    if(!ln) continue;
    if(/^【.*】$/.test(ln)) continue;
    let date=null, time=null, m;
    if(m = ln.match(/(20\d{2})\s*[-年\/.]\s*(\d{1,2})\s*[-月\/.]\s*(\d{1,2})\s*[日号]?/)){
      date = m[1]+"-"+pad2(m[2])+"-"+pad2(m[3]);
      ln = ln.replace(m[0], " ");
    }else if(m = ln.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/)){
      date = curYear+"-"+pad2(m[1])+"-"+pad2(m[2]);
      ln = ln.replace(m[0], " ");
    }
    if(date) lastDate = date; else date = lastDate;
    if(m = ln.match(/(上午|下午|晚上|中午)?\s*([01]?\d|2[0-3])\s*[:：点]\s*([0-5]\d)?\s*分?/)){
      let hh = +m[2];
      if((m[1]==="下午"||m[1]==="晚上") && hh<12) hh += 12;
      if(m[1]==="中午" && hh<6) hh += 12;
      time = pad2(hh)+":"+(m[3]||"00");
      ln = ln.replace(m[0], " ");
    }
    const title = ln.replace(/^[\s\-—–、，,：:;；.（）()【】\[\]]+/, "").replace(/\s+/g," ").trim();
    if(!title || !date) continue;
    let cat = "work";
    if(/党|团|支部|党课|团课|组织生活|主题党日|党员/.test(raw)) cat = "party";
    out.push({date, time, title, cat, note:"", done:false,
              id: Date.now()+"-"+Math.random().toString(36).slice(2,7)});
  }
  return out;
}
$("impParse").onclick = ()=>{
  impParsed = parseImport($("impText").value);
  if(!impParsed.length){ toast("没识别出条目：每行需要带日期（如 9月20日 或 2026-09-20）"); return; }
  const box = $("impList"); box.innerHTML="";
  impParsed.forEach(t=>{
    const el = document.createElement("div"); el.className="imp-item";
    el.innerHTML = '<span class="d">'+t.date.slice(5).replace("-","/")+'</span>'+
      '<span class="tm">'+(t.time||"")+'</span><span class="ti"></span>'+
      '<span class="t-cat '+t.cat+'">'+CAT_NAME[t.cat]+'</span>';
    el.querySelector(".ti").textContent = t.title;
    el.onclick = ()=>{ t._skip=!t._skip; el.style.opacity = t._skip?".35":"1"; };
    box.appendChild(el);
  });
  $("impPreview").style.display="block";
};
$("impBack").onclick = ()=>{ $("impPreview").style.display="none"; };
$("impConfirm").onclick = ()=>{
  const add = impParsed.filter(t=>!t._skip);
  tasks = tasks.concat(add);
  $("impMask").style.display="none";
  if(add.length){
    const last = add[add.length-1];
    selDate = last.date;
    curMonth = new Date(+last.date.slice(0,4), +last.date.slice(5,7)-1, 1);
  }
  renderAll(); scheduleSave();
  toast("已导入 "+add.length+" 条日程");
};

$("nextM").onclick = ()=>{ curMonth.setMonth(curMonth.getMonth()+1); renderCal(); };
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && DEK) backgroundPull(); });
